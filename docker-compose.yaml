services:
  llama-embed:
    build: .
    container_name: llama-embed
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --model-id
      - Snowflake/snowflake-arctic-embed-m-v2.0
      - --gguf-path
      - /models/snowflake-arctic-embed-m-v2.0.q4_k_mlp_q8_attn.gguf
      - --threads
      - "4"
      - --max-batch-tokens
      - "8192"

  llama-chat:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama-chat
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - -m
      - /models/qwen2.5-3b-instruct-q4_k_m.gguf
      - -c
      - "2048"
      - -n
      - "256"
      - -t
      - "4"
      - --jinja
      - --alias
      - qwen
