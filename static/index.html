<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPTIJET — Assistant technique</title>
  <style>
    :root {
      --bg: #12151a;
      --panel: #1c2128;
      --text: #eef2f6;
      --muted: #9aa6b2;
      --accent: #e07a2f;
      --user: #2b3644;
      --bot: #252b33;
      --line: #343c46;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Segoe UI, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body { display: flex; flex-direction: column; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 1.05rem; font-weight: 650; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 0.8rem; }
    select, button, textarea {
      font: inherit;
      color: var(--text);
    }
    select {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 46rem;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); }
    .msg.error { border-color: #a33; }
    .meta { margin-top: 8px; color: var(--muted); font-size: 0.82rem; }
    .sources { margin: 8px 0 0; padding-left: 1.1rem; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }
    textarea {
      flex: 1;
      min-height: 52px;
      max-height: 140px;
      resize: vertical;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
    button[type="submit"] {
      background: var(--accent);
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      font-weight: 700;
      cursor: pointer;
      min-width: 108px;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Assistant technique OPTIJET</h1>
      <p>Les réponses viennent des manuels indexés, pas du modèle seul.</p>
    </div>
    <label>Langue
      <select id="lang">
        <option value="fr" selected>FR</option>
        <option value="en">EN</option>
      </select>
    </label>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="question" rows="2" placeholder="Ex. Comment démarrer la machine ?" required></textarea>
    <button type="submit" id="send">Envoyer</button>
  </form>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("question");
    const send = document.getElementById("send");
    const lang = document.getElementById("lang");

    function add(role, html, cls) {
      const el = document.createElement("div");
      el.className = "msg " + role + (cls ? " " + cls : "");
      el.innerHTML = html;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function esc(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    add("bot", "Posez une question sur l'OptiJet. J'utilise uniquement les extraits du manuel.");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      add("user", esc(question));
      input.value = "";
      send.disabled = true;
      const pending = add("bot", "Recherche dans le manuel…");
      try {
        const response = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, lang: lang.value }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Erreur serveur");
        let html = esc(data.answer || "");
        if (data.sources && data.sources.length) {
          html += '<div class="meta">Sources</div><ul class="sources">';
          for (const src of data.sources) {
            const start = src.start_page || src.page || "?";
            const end = src.end_page || start;
            const pages = start === end ? "p." + start : "p." + start + "-" + end;
            html += "<li>" + esc(src.source || "") + " " + pages;
            if (src.heading) html += " — " + esc(src.heading);
            html += "</li>";
          }
          html += "</ul>";
        }
        if (typeof data.confidence === "number" && data.confidence > 0) {
          html += '<div class="meta">Confiance : ' + data.confidence.toFixed(2) + "</div>";
        }
        pending.innerHTML = html;
      } catch (err) {
        pending.classList.add("error");
        pending.textContent = String(err.message || err);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
